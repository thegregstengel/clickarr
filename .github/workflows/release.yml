name: Release

# Cut a release by pushing a tag that matches app/build.gradle.kts versionName: `git tag v0.1.0 && git push origin v0.1.0`.
# Needs the signing secrets from docs/release.md; without them the job stops before building.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in the build
        run: |
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          echo "versionName=$VERSION tag=${GITHUB_REF_NAME}"
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match versionName $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the signing secrets are present
        env:
          KS: ${{ secrets.CLICKARR_KEYSTORE_BASE64 }}
        run: test -n "$KS" || { echo "CLICKARR_KEYSTORE_BASE64 is not set; see docs/release.md"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version code for this build (minutes since 2026-01-01 UTC)
        run: echo "VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"

      - name: Decode the keystore
        env:
          KS: ${{ secrets.CLICKARR_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          CLICKARR_VERSION_CODE: ${{ env.VERSION_CODE }}
          CLICKARR_GOOGLE_CLIENT_ID: ${{ secrets.CLICKARR_GOOGLE_CLIENT_ID }}
          CLICKARR_GOOGLE_CLIENT_SECRET: ${{ secrets.CLICKARR_GOOGLE_CLIENT_SECRET }}
          CLICKARR_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CLICKARR_KEYSTORE_PASSWORD: ${{ secrets.CLICKARR_KEYSTORE_PASSWORD }}
          CLICKARR_KEY_ALIAS: ${{ secrets.CLICKARR_KEY_ALIAS }}
          CLICKARR_KEY_PASSWORD: ${{ secrets.CLICKARR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name and checksum the artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "clickarr-${VERSION}.apk"
          cp "clickarr-${VERSION}.apk" clickarr.apk
          sha256sum "clickarr-${VERSION}.apk" clickarr.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          echo "apksigner: ${APKSIGNER:-not found under $SDK}"
          SIGNER=""
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs clickarr.apk | tee certs.txt
            SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt | head -1)"
          fi
          test -n "$SIGNER" || echo "::warning::could not read the APK's signer; version.json will not carry one"
          printf '{"versionCode":%s,"versionName":"%s","apk":"clickarr.apk","sha256":"%s","signer":"%s","channel":"release"}\n' \
            "$VERSION_CODE" "$VERSION" "$(sha256sum clickarr.apk | cut -d' ' -f1)" "$SIGNER" > version.json

      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            /^## / { on = index($0, "[" v "]") > 0 || index($0, " " v " ") > 0 || index($0, " " v "$") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $VERSION. See CHANGELOG.md." > notes.md
          printf '\n\nInstall: Downloader code or URL at clickarr.net/apk. Verify with SHA256SUMS.txt.\n' >> notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" $PRE --title "Clickarr $VERSION" --notes-file notes.md \
            "clickarr-${VERSION}.apk" clickarr.apk SHA256SUMS.txt version.json
