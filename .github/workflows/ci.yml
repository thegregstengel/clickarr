name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Version code for this build (minutes since 2026-01-01 UTC)
        run: echo "VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"

      # One long-lived key for every nightly (docs/release.md), so a nightly installs over the previous one.
      - name: Nightly signing key
        env:
          KS: ${{ secrets.CLICKARR_NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/nightly.jks"
            echo "CLICKARR_NIGHTLY_KEYSTORE_PATH=$RUNNER_TEMP/nightly.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::CLICKARR_NIGHTLY_KEYSTORE_BASE64 is not set: this nightly is signed with a throwaway key and devices will refuse to update over an earlier nightly."
          fi

      - name: Static analysis
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug APK
        env:
          CLICKARR_VERSION_CODE: ${{ env.VERSION_CODE }}
          CLICKARR_GOOGLE_CLIENT_ID: ${{ secrets.CLICKARR_GOOGLE_CLIENT_ID }}
          CLICKARR_GOOGLE_CLIENT_SECRET: ${{ secrets.CLICKARR_GOOGLE_CLIENT_SECRET }}
          CLICKARR_NIGHTLY_KEYSTORE_PATH: ${{ env.CLICKARR_NIGHTLY_KEYSTORE_PATH }}
          CLICKARR_NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.CLICKARR_NIGHTLY_KEYSTORE_PASSWORD }}
          CLICKARR_NIGHTLY_KEY_ALIAS: ${{ secrets.CLICKARR_NIGHTLY_KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug --no-daemon

      # The signer digest lets the app say up front when a build cannot update over the installed one.
      - name: Describe the build for the in-app updater
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)-debug"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          echo "apksigner: ${APKSIGNER:-not found under $SDK}"
          SIGNER=""
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
            SIGNER="$(sed -n 's/^.*certificate SHA-256 digest: //p' certs.txt | head -1)"
          fi
          test -n "$SIGNER" || echo "::warning::could not read the APK's signer; version.json will not carry one"
          printf '{"versionCode":%s,"versionName":"%s","apk":"clickarr-nightly-debug.apk","sha256":"%s","signer":"%s","channel":"nightly"}\n' \
            "$VERSION_CODE" "$NAME" "$SHA" "$SIGNER" > app/build/outputs/apk/debug/version.json
          cat app/build/outputs/apk/debug/version.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clickarr-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/version.json
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  reproducible:
    name: Reproducible build check
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the unsigned release APK with a fixed version code
        env:
          CLICKARR_VERSION_CODE: "1"
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Checksum
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1 > "sha-${{ matrix.attempt }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-${{ matrix.attempt }}
          path: sha-${{ matrix.attempt }}.txt

  reproducible-compare:
    name: Compare the two builds
    needs: reproducible
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reproducible-*
          merge-multiple: true
      - name: The two checksums must match (ADR 0017)
        run: |
          cat sha-1.txt sha-2.txt
          test "$(cat sha-1.txt)" = "$(cat sha-2.txt)"

  nightly:
    name: Publish nightly APK
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clickarr-debug-apk
          path: apk

      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish or update the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/app-debug.apk clickarr-nightly-debug.apk
          sha256sum clickarr-nightly-debug.apk > clickarr-nightly-debug.apk.sha256
          NOTES="Automated debug build of main at ${GITHUB_SHA::7}. Not a release; expect rough edges. Install with Downloader from clickarr.net/nightly."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly (debug)" --notes "$NOTES"
          else
            gh release create nightly --prerelease --title "Nightly (debug)" --notes "$NOTES"
          fi
          gh release upload nightly clickarr-nightly-debug.apk clickarr-nightly-debug.apk.sha256 apk/version.json --clobber
