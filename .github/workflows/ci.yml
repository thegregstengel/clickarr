name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Version code for this build (minutes since 2026-01-01 UTC)
        run: echo "VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"

      - name: Static analysis
        run: ./gradlew detekt --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug APK
        env:
          CLICKARR_VERSION_CODE: ${{ env.VERSION_CODE }}
          CLICKARR_GOOGLE_CLIENT_ID: ${{ secrets.CLICKARR_GOOGLE_CLIENT_ID }}
          CLICKARR_GOOGLE_CLIENT_SECRET: ${{ secrets.CLICKARR_GOOGLE_CLIENT_SECRET }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Describe the build for the in-app updater
        run: |
          NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)-debug"
          SHA="$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
          printf '{"versionCode":%s,"versionName":"%s","apk":"clickarr-nightly-debug.apk","sha256":"%s","channel":"nightly"}\n' \
            "$VERSION_CODE" "$NAME" "$SHA" > app/build/outputs/apk/debug/version.json
          cat app/build/outputs/apk/debug/version.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clickarr-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/version.json
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  nightly:
    name: Publish nightly APK
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clickarr-debug-apk
          path: apk

      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish or update the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/app-debug.apk clickarr-nightly-debug.apk
          sha256sum clickarr-nightly-debug.apk > clickarr-nightly-debug.apk.sha256
          NOTES="Automated debug build of main at ${GITHUB_SHA::7}. Not a release; expect rough edges. Install with Downloader from clickarr.net/nightly."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly (debug)" --notes "$NOTES"
          else
            gh release create nightly --prerelease --title "Nightly (debug)" --notes "$NOTES"
          fi
          gh release upload nightly clickarr-nightly-debug.apk clickarr-nightly-debug.apk.sha256 apk/version.json --clobber
